<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAKOBI</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; }
      :root {
        --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      /* 色は styles/theme.css のトークン。読み込む前でも暗い画面になるよう、元の色を予備に書いておく */
      body {
        font-family: var(--font-family);
        background: var(--slate-900, #0f172a);
        color: var(--slate-200, #e2e8f0);
        overflow: hidden;
      }
      :root[data-theme="light"] body {
        background: var(--slate-900, #f8fafc);
        color: var(--slate-200, #0f172a);
      }
      button, input, select, textarea {
        font-family: inherit;
        /* 文字の大きさを書いていないボタン・入力欄も、設定の文字の大きさに合わせる（標準ではブラウザの既定と同じ 13.33px） */
        font-size: 0.8333rem;
      }
      :focus-visible { outline: 3px solid var(--sky-400, #38bdf8); outline-offset: 2px; }
      /* 入力欄は部品の書き方（outline: none）に関係なく、キーボードで入ったことが分かる枠を出す */
      input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--sky-400, #38bdf8) !important; outline-offset: 0 !important; }
      /* 保存できない入力の欄。色だけに頼らず、欄の下の文（role=alert）でも伝える */
      input[aria-invalid="true"], select[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--red-500) !important; }
      input[aria-invalid="true"]:focus-visible, select[aria-invalid="true"]:focus-visible, textarea[aria-invalid="true"]:focus-visible { outline-color: var(--red-500) !important; }
      /* 画面全体（本文の区分け）にフォーカスを移したときは、内側に枠を出す（外側だと画面の端で切れる） */
      /* チェックボックス・ラジオは文字の大きさに合わせる（ブラウザの既定は 13px のまま変わらない） */
      input[type="checkbox"], input[type="radio"] { width: 1rem; height: 1rem; }
      /* 狭い窓（1180px 以下）で隠す説明・出す短い表記。ほかの窓と並べて使う人の画面で、上の説明が中身を押し出さないように */
      .hakobi-show-narrow { display: none; }
      /* 1行に並べて横にスクロールするチップの列。中の部品は縮めず折り返さない */
      .hakobi-chip-strip > * { flex-shrink: 0; white-space: nowrap; }
      @media (max-width: 1180px) { .hakobi-hide-narrow { display: none !important; } .hakobi-show-narrow { display: inline; } }
      /* スクロールバーの色をテーマに合わせる（色を書いていない所だけ、ダークの中に明るいスクロールバーが出ていた） */
      html { scrollbar-color: var(--slate-600, #475569) transparent; }
      [data-focus-region]:focus-visible { outline: 3px solid var(--sky-400, #38bdf8) !important; outline-offset: -3px !important; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
      }
    </style>
    <script>
      // ライトテーマの人が開いたときに、一瞬暗い画面が出ないよう、描く前にテーマを決めておく（App が同じ規則で付け直す）。
      // 「OS に合わせる」のときは、OS の切り替えにもついていく（App を出さないタイマーなどの窓も同じ）
      (function () {
        function applyTheme() {
          try {
            var savedTheme = window.localStorage.getItem('app-theme-mode')
            var light = savedTheme === 'light' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)
            document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark')
          } catch (error) {
            // 読めないときはダークのまま
          }
        }
        applyTheme()
        try {
          window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function () {
            if (window.localStorage.getItem('app-theme-mode') === 'system') applyTheme()
          })
        } catch (error) {
          // matchMedia を使えないときは、開いたときのテーマのまま
        }
        // ほかの窓（メイン画面など）でテーマを変えたら、開いている窓も合わせる
        window.addEventListener('storage', function (event) {
          if (event.key === 'app-theme-mode') applyTheme()
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
