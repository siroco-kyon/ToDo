<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAKOBI</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; }
      :root {
        --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      /* 色は styles/theme.css のトークン。読み込む前でも暗い画面になるよう、元の色を予備に書いておく */
      body {
        font-family: var(--font-family);
        background: var(--slate-900, #0f172a);
        color: var(--slate-200, #e2e8f0);
        overflow: hidden;
      }
      :root[data-theme="light"] body {
        background: var(--slate-900, #f8fafc);
        color: var(--slate-200, #0f172a);
      }
      button, input, select, textarea {
        font-family: inherit;
      }
      :focus-visible { outline: 3px solid var(--sky-400, #38bdf8); outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
      }
    </style>
    <script>
      // ライトテーマの人が開いたときに、一瞬暗い画面が出ないよう、描く前にテーマを決めておく（App が同じ規則で付け直す）
      try {
        var savedTheme = window.localStorage.getItem('app-theme-mode')
        var light = savedTheme === 'light' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark')
      } catch (error) {
        // 読めないときはダークのまま
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
