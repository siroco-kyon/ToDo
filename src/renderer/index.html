<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAKOBI</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; }
      :root {
        --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        font-family: var(--font-family);
        background: #0f172a;
        color: #e2e8f0;
        overflow: hidden;
      }
      button, input, select, textarea {
        font-family: inherit;
      }
      :focus-visible { outline: 3px solid #38bdf8; outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
      }
      body.theme-light {
        background: #f8fafc;
        color: #0f172a;
      }
      body.theme-light #root {
        filter: invert(1) hue-rotate(180deg);
      }
      /* 画面全体を色反転してライトにしているので、反転させたくないものは2回反転して元の見た目に戻す。
         チェックボックス・ラジオボタンは反転すると、チェックしていないのに黒く塗りつぶして見える */
      body.theme-light #root img,
      body.theme-light #root video,
      body.theme-light #root canvas,
      body.theme-light #root input[type="checkbox"],
      body.theme-light #root input[type="radio"] {
        filter: invert(1) hue-rotate(180deg);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
